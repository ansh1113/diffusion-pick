# Ablation: v1 + 100 recovery demos (no distractors, v1 augmentation).
# Identical architecture / optimizer / steps to dp_reduced.yaml (v1).
policy: diffusion
data:
- data/demos_64.zarr
- data/recovery_64.zarr
img_size: 64
model:
  action_dim: 5
  proprio_dim: 12
  obs_horizon: 2
  pred_horizon: 16
  action_horizon: 8
  enc_width: 16
  enc_stem: small
  num_kp: 32
  img_feat_dim: 64
  down_dims:
  - 64
  - 128
  - 256
  step_embed_dim: 64
  num_train_steps: 100
  num_inference_steps: 10
  aug_pad: 4
  aug_jitter: 0.2
  aug_strong: false
train:
  batch_size: 64
  lr: 0.0003
  weight_decay: 1.0e-06
  steps: 12000
  warmup: 500
  ema: true
  log_every: 100
  ckpt_every: 2000
  seed: 0
